    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "O Circular Experience é mais uma palestra ou é diferente?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "É um workshop imersivo — bem diferente de uma palestra. Os participantes não apenas ouvem: eles analisam produtos reais, trabalham em grupo com materiais concretos e produzem entregas ao longo da sessão."
          }
        },
        {
          "@type": "Question",
          "name": "Qual é a duração? Dá para encaixar na grade da Semana do Meio Ambiente?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. Existem duas modalidades: Edição Compacta (2h) — ideal para eventos ou programações mais curtas; e Imersão Completa (4h) — formato completo, com a Matriz de Intenções Estratégicas e coffee break."
          }
        },
        {
          "@type": "Question",
          "name": "Quantas pessoas podem participar?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cada sessão comporta até 30 participantes. Esse limite garante qualidade na experiência e participação ativa nas dinâmicas."
          }
        },
        {
          "@type": "Question",
          "name": "O que está incluído? O que precisamos providenciar?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Incluso: metodologia completa, seleção e facilitação do especialista, materiais didáticos, divulgação nos canais do Movimento Circular e relatório pós-evento. Por conta da empresa: espaço físico, coffee break (formato 4h) e gerenciamento dos participantes."
          }
        },
        {
          "@type": "Question",
          "name": "O que o time vai levar de concreto ao final da sessão?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cada participante sai com nivelamento em Economia Circular, insights práticos e, no formato de 4 horas, um Canvas preenchido com encaminhamentos concretos. O Movimento Circular entrega também um Relatório de Intenções Estratégicas."
          }
        },
        {
          "@type": "Question",
          "name": "Nossa empresa ainda não tem política de ESG. Faz sentido contratar?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Faz, e é exatamente para isso que o Circular Experience foi pensado. Ele é um ótimo ponto de partida para empresas que estão começando sua agenda de sustentabilidade."
          }
        },
        {
          "@type": "Question",
          "name": "Posso misturar equipes de diferentes áreas e cargos na mesma sessão?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Funciona muito bem assim. A diversidade de perspectivas dentro do grupo enriquece as dinâmicas — gestores, analistas, times de ESG, inovação e supply chain contribuem de formas diferentes."
          }
        },
        {
          "@type": "Question",
          "name": "Com quanto de antecedência preciso contratar para a Semana do Meio Ambiente?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Recomendamos pelo menos 3 a 4 semanas de antecedência para garantir personalização do conteúdo, produção dos materiais e alinhamento logístico."
          }
        }
      ]
